name: DGB Agent Python checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
  push:
    branches: [feature/pr01-designbrief-state, feature/pr02-deepseek-react, feature/pr03-engineering-knowledge]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests -m "not live"
      - run: ruff check .
      - run: python examples/pr01_demo.py
      - run: python -m bearing_agent_system.chat_cli --help
      - run: python examples/pr02_live_eval.py --help
      - run: python examples/pr03_live_eval.py --help
      - run: python examples/pr03_semantic_smoke.py --help
