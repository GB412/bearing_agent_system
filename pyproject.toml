[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-agent-system"
version = "0.1.0"
description = "Trusted DGB design brief foundation for a future conversation agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
agent = [
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "openai>=2.0,<3",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "openai>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the paid DeepSeek API (explicit opt-in only)",
]
